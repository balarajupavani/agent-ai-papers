[project]
name = "parse-ai-papers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "fastapi[all]>=0.121.2",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.44",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pre-commit>=4.4.0",
    "ruff>=0.14.5",
    "pytest-cov>=7.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-env>=1.2.0",
    "pytest-mock>=3.15.1",
    "testcontainers>=4.13.3",
    "types-sqlalchemy>=1.4.53.38",
    "pytest>=9.0.1",
    "pytest-aiohttp>=1.1.0",
    "mypy>=1.18.2",
]

[tool.ruff]
line-length = 130
exclude = ["notebooks/**", ".venv/**"]
src = ["src", "tests"]
lint.select = [
  "I",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env_files = ".env.test"

[tool.mypy]
explicit_package_bases = true
ignore_errors = true
